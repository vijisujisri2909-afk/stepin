<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment successful - StepUp.in</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-[#f7faf9] text-gray-900">
  <main class="mx-auto flex min-h-screen max-w-xl items-center justify-center px-5 py-12">
    <section class="w-full rounded-2xl border border-gray-200 bg-white p-8 text-center shadow-lg">
      <div class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-full bg-[#e6f3ee] text-3xl text-[#2d4a45]">✓</div>
      <h1 class="font-serif text-3xl font-bold">Payment successful</h1>
      <p class="mt-3 text-gray-600">Thank you for shopping with StepUp.in. Your payment has been verified.</p>
      {% if reference %}<p class="mt-5 font-semibold">Order reference: {{ reference }}</p>{% endif %}
      <a href="{% url 'home' %}" class="mt-7 inline-block rounded-lg bg-[#2d4a45] px-6 py-3 font-semibold text-white hover:bg-[#203632]">Continue shopping</a>
    </section>
  </main>
</body>
</html>
